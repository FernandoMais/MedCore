
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedCore Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Estilos de Impressão Profissionais */
        @media print {
            @page {
                margin: 10mm;
                size: a4;
            }
            body { 
                background: white !important; 
                color: black !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            aside, header, nav, button, .no-print, #sidebar, .tabs-navigation, .alert-banner, .no-print-area { display: none !important; }
            
            .print-only { display: block !important; }
            
            main { 
                margin: 0 !important; 
                padding: 0 !important; 
                width: 100% !important; 
                display: block !important;
                overflow: visible !important;
                background: white !important;
            }

            /* Estilo específico para Receita Médica */
            .prescription-print {
                display: block !important;
                padding: 20mm;
                border: none;
                min-height: 297mm;
                width: 210mm;
                margin: 0 auto;
                background: white !important;
            }

            .prescription-header {
                text-align: center;
                border-bottom: 2pt solid #2563eb;
                margin-bottom: 20pt;
                padding-bottom: 15pt;
            }

            .prescription-body {
                font-size: 13pt;
                line-height: 1.8;
                margin-bottom: 40pt;
                min-height: 150mm;
                color: #1e293b !important;
            }

            .prescription-footer {
                text-align: center;
                margin-top: 30pt;
                border-top: 1pt solid #cbd5e1;
                padding-top: 15pt;
            }

            .signature-line {
                width: 80mm;
                border-top: 1.5pt solid black !important;
                margin: 30pt auto 8pt auto;
            }

            /* Estilização da Evolução no PDF */
            .history-content {
                page-break-inside: auto;
                white-space: pre-wrap !important;
                word-wrap: break-word !important;
            }

            h1, h2, h3 { color: black !important; page-break-after: avoid; }
        }

        .print-only { display: none; }
    </style>
<script type="importmap">

  }
}
</script>
</head>

    <div id="root"></div>
</body>
</html>
