
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedCore Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Estilos de Impressão Profissionais */
        @media print {
            @page {
                margin: 15mm;
                size: a4;
            }
            body { 
                background: white !important; 
                color: black !important;
                -webkit-print-color-adjust: exact !important;
                print-color-adjust: exact !important;
            }
            aside, header, nav, button, .no-print, #sidebar, .tabs-navigation, .alert-banner { display: none !important; }
            
            .print-only { display: block !important; }
            
            main { 
                margin: 0 !important; 
                padding: 0 !important; 
                width: 100% !important; 
                display: block !important;
                overflow: visible !important;
            }

            .printable-document { 
                display: block !important;
                position: relative !important;
                width: 100% !important;
                border: none !important;
                box-shadow: none !important;
                margin: 0 !important;
                padding: 0 !important;
            }

            /* Estilização da Evolução no PDF */
            .history-content {
                page-break-inside: auto;
                white-space: pre-wrap !important;
                word-wrap: break-word !important;
            }

            .evolution-block {
                page-break-inside: avoid;
                border-bottom: 1pt solid #eee;
                margin-bottom: 10pt;
                padding-bottom: 10pt;
            }

            h1, h2, h3 { color: black !important; page-break-after: avoid; }
            
            .print-alert { 
                border: 1px solid #000 !important; 
                padding: 10px !important;
                background-color: #f9f9f9 !important;
                margin-bottom: 15px !important;
                page-break-inside: avoid;
            }

            /* Forçar cores de fundo em PDF */
            .bg-slate-50 { background-color: #f8fafc !important; }
            .bg-blue-600 { background-color: #2563eb !important; color: white !important; }
        }

        .print-only { display: none; }
    </style>

</body>
</html>
