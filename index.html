
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MedCore Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
        
        /* Estilos de Impressão (Exportação PDF) */
        @media print {
            body { background: white !important; }
            aside, header, nav, button, .no-print { display: none !important; }
            .print-only { display: block !important; }
            main { margin: 0 !important; padding: 0 !important; width: 100% !important; overflow: visible !important; }
            .bg-slate-50, .bg-slate-50\/50, .bg-blue-600, .bg-slate-900, .bg-slate-50\/30 { background: white !important; color: black !important; }
            .border, .border-slate-200, .border-slate-100 { border: 1px solid #e2e8f0 !important; }
            .shadow-sm, .shadow-xl, .shadow-2xl { box-shadow: none !important; }
            .rounded-[40px], .rounded-[32px], .rounded-3xl, .rounded-2xl { border-radius: 8px !important; }
            .animate-in { animation: none !important; }
            .overflow-y-auto { overflow: visible !important; height: auto !important; }
            
            /* Ajustes específicos para o prontuário */
            .printable-document { 
                padding: 0 !important; 
                max-width: 100% !important; 
                border: none !important; 
                position: static !important;
                box-shadow: none !important;
            }
            .printable-document > div { border: none !important; padding: 20px 0 !important; }
            
            /* Destaque de Alertas na Impressão */
            .print-alert { 
                border: 2px solid #ef4444 !important; 
                padding: 15px !important;
                background-color: #fef2f2 !important;
                -webkit-print-color-adjust: exact;
            }
            
            h1, h2, h3 { color: black !important; }
            .text-blue-600 { color: #2563eb !important; }
            .text-red-600 { color: #dc2626 !important; }
        }
    </style>
<script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "recharts": "https://esm.sh/recharts@^3.6.0",
    "@google/genai": "https://esm.sh/@google/genai@^1.34.0",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
</head>

    <div id="root"></div>
</body>
</html>
